<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <title>Dashspace</title>
  <meta name="description" content="Dashspace creates simple, useful apps designed to make everyday tasks easier.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #1f2937;
      line-height: 1.6;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 8%;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111827;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .content {
      max-width: 720px;
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 7vw, 68px);
      line-height: 1.1;
      letter-spacing: -2px;
      color: #111827;
      margin-bottom: 24px;
    }

    .tagline {
      font-size: 21px;
      color: #6b7280;
      max-width: 580px;
      margin: 0 auto 56px;
    }

    .apps {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 36px;
      margin-bottom: 42px;
    }

    .apps h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #111827;
    }

    .apps p {
      color: #6b7280;
    }

    .contact {
      font-size: 15px;
      color: #6b7280;
    }

    .contact a {
      color: #2563eb;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 28px 20px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="brand">Dashspace</div>
    </header>

    <main>
      <div class="content">

        <h1>Simple apps.<br>Useful ideas.</h1>

        <p class="tagline">
          Dashspace creates thoughtfully designed apps that make everyday tasks simpler.
        </p>

        <section class="apps">
          <h2>Our Apps</h2>
          <p>
            We're working on useful new apps.<br>
            More information coming soon.
          </p>
        </section>

        <p class="contact">
          Contact us at
          <a href="mailto:contact@dashspace.io">contact@dashspace.io</a>
        </p>

      </div>
    </main>

    <footer>
      &copy; 2026 Dashspace
    </footer>

  </div>
</body>
</html>
